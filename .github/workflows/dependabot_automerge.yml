name: Dependabot auto-merge

on: pull_request

permissions: {}

# A new push to the PR cancels the run still waiting on the old commit's CI, so
# only the latest commit can be merged and a human push never is.
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    # Dependabot's own PRs only, and only when Dependabot triggered the run:
    # a human push to its branch must not inherit auto-merge.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read
      contents: write
      pull-requests: write
    steps:
      # Also verifies the commits are signed by Dependabot.
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Majors can break the plugin and need a human. Everything else is merged once
      # CI and CodeQL have passed. main has no required checks (the release workflow
      # pushes the manifest to it directly), so nothing else would hold the merge
      # back: wait here. The ruleset rejects a merge before CodeQL has results.
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in $(seq 1 90); do
            state=$(gh pr checks "$PR_URL" --json name,bucket --jq '
              [.[] | select(.name == "call / build" or .name == "call / test" or .name == "e2e"
                or .name == "Analyze (csharp)")] as $c
              | if ($c | length) < 4 then "pending"
                elif any($c[]; .bucket == "fail" or .bucket == "cancel") then "fail"
                elif all($c[]; .bucket == "pass") then "pass"
                else "pending" end' || true)
            [ "$state" = pass ] && break
            [ "$state" = fail ] && { echo "CI failed, not merging"; exit 1; }
            sleep 20
          done
          [ "$state" = pass ] || { echo "CI did not finish in time, not merging"; exit 1; }

          [ "$(gh pr view "$PR_URL" --json reviewDecision -q .reviewDecision)" = APPROVED ] \
            || gh pr review --approve "$PR_URL"
          gh pr merge --squash "$PR_URL"
